name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build kernel + userland C/C++ (Makefile)
        run: |
          make build/userland/shell.elf build/userland/ipc_demo.elf build/userland/simple_test.elf

      - name: Build QEMU disk image
        run: |
          make qemu-disk
